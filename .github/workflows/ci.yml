name: CI

# Quando o robô roda: a cada push na main e em cada pull request
on:
    push:
        branches: [main]
    pull_request:

jobs:
    qualidade:
        name: Qualidade (formatação, lint, tipos, testes e build)
        runs-on: ubuntu-latest

        steps:
            - name: Baixar o código
              uses: actions/checkout@v4

            - name: Instalar o Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Instalar dependências (exatamente as do package-lock)
              run: npm ci

            - name: Formatação (Prettier)
              run: npm run format:check

            - name: Lint (ESLint)
              run: npm run lint

            - name: Tipos (TypeScript)
              run: npm run typecheck

            - name: Testes (Vitest)
              run: npm test

            - name: Build (Vite)
              run: npm run build
